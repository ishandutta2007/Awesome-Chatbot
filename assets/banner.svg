<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="50" result="blur" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 54px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }

    /* Ambient animated lighting */
    @keyframes pulseOrb1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.35; }
      50% { transform: translate(40px, -20px) scale(1.15); opacity: 0.55; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.3; }
      50% { transform: translate(-50px, 30px) scale(1.2); opacity: 0.5; }
    }
    @keyframes flowGrid {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 40; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes scanLine {
      0% { transform: translateY(-400px); opacity: 0; }
      50% { opacity: 0.3; }
      100% { transform: translateY(400px); opacity: 0; }
    }

    .orb-1 { animation: pulseOrb1 9s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb2 11s ease-in-out infinite; transform-origin: 1000px 300px; }
    .stream-line { stroke-dasharray: 8 12; animation: flowGrid 2.5s linear infinite; }
    .pill-1 { animation: floatPill 5s ease-in-out infinite; }
    .pill-2 { animation: floatPill 6s ease-in-out infinite 1s; }
    .pill-3 { animation: floatPill 5.5s ease-in-out infinite 2s; }
    .pill-4 { animation: floatPill 7s ease-in-out infinite 1.5s; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Animated Ambient Glows (placed behind foreground text) -->
  <g class="orb-1" filter="url(#softGlow)">
    <circle cx="240" cy="120" r="140" fill="#6366f1" />
  </g>
  <g class="orb-2" filter="url(#softGlow)">
    <circle cx="980" cy="260" r="160" fill="#ec4899" />
  </g>
  <g filter="url(#softGlow)">
    <circle cx="600" cy="380" r="130" fill="#06b6d4" opacity="0.25" />
  </g>

  <!-- Subtle Modern Mesh Grid Lines -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="450" y1="0" x2="450" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="750" y1="0" x2="750" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1050" y1="0" x2="1050" y2="400" />
  </g>

  <!-- Animated Data Circuit Streams (Background Accent) -->
  <path class="stream-line" d="M -50 200 C 250 120, 350 280, 600 200 S 950 120, 1250 200" fill="none" stroke="url(#primaryGrad)" stroke-width="2.5" opacity="0.4" />
  <path class="stream-line" d="M -50 260 C 200 320, 450 160, 700 240 S 1000 340, 1250 260" fill="none" stroke="url(#cyanGrad)" stroke-width="1.8" opacity="0.3" />

  <!-- Outer Glassmorphic Border Frame -->
  <rect x="20" y="20" width="1160" height="360" rx="18" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />

  <!-- Subtle Bot Icon Graphic in Upper Center/Left -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <!-- Outer Ring with Dash Animation -->
    <circle cx="0" cy="0" r="32" fill="rgba(99, 102, 241, 0.12)" stroke="url(#primaryGrad)" stroke-width="2" />
    <path d="M -12 -6 C -12 -12 12 -12 12 -6 C 12 10 -12 10 -12 -6 Z" fill="none" stroke="#e2e8f0" stroke-width="2" />
    <circle cx="-6" cy="-2" r="2.5" fill="#38bdf8" />
    <circle cx="6" cy="-2" r="2.5" fill="#38bdf8" />
    <line x1="0" y1="-14" x2="0" y2="-20" stroke="#a855f7" stroke-width="2" stroke-linecap="round" />
    <circle cx="0" cy="-22" r="2.5" fill="#ec4899" />
  </g>

  <!-- FOREGROUND CONTENT: Title & Subtitle Always in Clear Front -->
  <g text-anchor="middle">
    <!-- Main Title with Gradient fill -->
    <text x="600" y="165" class="title-text" filter="drop-shadow(0 4px 14px rgba(0, 0, 0, 0.8))">
      🤖 Awesome Chatbot
    </text>

    <!-- Subtitle -->
    <text x="600" y="210" class="subtitle-text" filter="drop-shadow(0 2px 8px rgba(0, 0, 0, 0.9))">
      The Curated Directory of Enterprise SaaS &amp; Open-Source Conversational AI
    </text>
  </g>

  <!-- Interactive/Dynamic Feature Pills (Positioned nicely at bottom, non-overlapping) -->
  <g class="pill-1" transform="translate(140, 275)">
    <rect width="180" height="42" rx="21" fill="url(#cardGrad)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.2" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.4))" />
    <circle cx="24" cy="21" r="5" fill="#6366f1" />
    <text x="100" y="26" class="badge-text" text-anchor="middle">⚡ LLMs &amp; Agents</text>
  </g>

  <g class="pill-2" transform="translate(360, 275)">
    <rect width="200" height="42" rx="21" fill="url(#cardGrad)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.2" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.4))" />
    <circle cx="24" cy="21" r="5" fill="#a855f7" />
    <text x="110" y="26" class="badge-text" text-anchor="middle">🏢 Enterprise SaaS</text>
  </g>

  <g class="pill-3" transform="translate(600, 275)">
    <rect width="210" height="42" rx="21" fill="url(#cardGrad)" stroke="rgba(236, 72, 153, 0.4)" stroke-width="1.2" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.4))" />
    <circle cx="24" cy="21" r="5" fill="#ec4899" />
    <text x="115" y="26" class="badge-text" text-anchor="middle">⭐ 150k+ Star Repos</text>
  </g>

  <g class="pill-4" transform="translate(850, 275)">
    <rect width="200" height="42" rx="21" fill="url(#cardGrad)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1.2" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.4))" />
    <circle cx="24" cy="21" r="5" fill="#06b6d4" />
    <text x="110" y="26" class="badge-text" text-anchor="middle">💰 Pricing &amp; Limits</text>
  </g>
</svg>
